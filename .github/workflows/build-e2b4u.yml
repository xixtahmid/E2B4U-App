name: Build E2B4U Production APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Permanent Signing Keystore & Print SHA-1
        run: |
          if [ ! -f android.keystore ]; then
            keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Tahmid, OU=E2B4U, O=E2B4U, L=Dhaka, S=Dhaka, C=BD"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android.keystore
            git commit -m "Save permanent signing keystore" || true
            git push || true
          fi
          SHA1=$(keytool -list -v -keystore android.keystore -alias android -storepass android123 | grep -oE '([0-9A-F]{2}:){19}[0-9A-F]{2}' | head -n 1)
          echo "### 🔑 Firebase SHA-1 Fingerprint (Unchanged):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "$SHA1" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate Standalone Android WebView Project
        run: |
          mkdir -p app/src/main/java/com/tahmid/e2b4u
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "E2B4U"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tahmid.e2b4u'
              compileSdk 34

              defaultConfig {
                  applicationId "com.tahmid.e2b4u"
                  minSdk 21
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../android.keystore")
                      storePassword "android123"
                      keyAlias "android"
                      keyPassword "android123"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-auth:21.2.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="E2B4U"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.E2B4U">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/tahmid/e2b4u/MainActivity.java
          package com.tahmid.e2b4u;

          import android.annotation.SuppressLint;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import com.google.android.gms.auth.api.signin.GoogleSignIn;
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount;
          import com.google.android.gms.auth.api.signin.GoogleSignInClient;
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions;
          import com.google.android.gms.common.api.ApiException;
          import com.google.android.gms.tasks.Task;
          import java.util.Locale;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends AppCompatActivity {

              private WebView mainWebView;
              private GoogleSignInClient googleSignInClient;
              private ValueCallback<Uri[]> filePathCallback;
              private TextToSpeech textToSpeech;
              private boolean ttsReady = false;
              private String pendingTtsText = null;
              private float pendingTtsRate = 1.0f;

              private static final int FILE_CHOOSER_CODE = 1001;
              private static final int RC_GOOGLE_SIGN_IN = 9001;
              private static final String APP_URL = "https://e2b4u.pages.dev/";
              private static final String WEB_CLIENT_ID = "104360586695-gsa27g6hqlqjefdv757q7a6affbc8db3.apps.googleusercontent.com";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  initTextToSpeech();

                  GoogleSignInOptions gso = new GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                          .requestIdToken(WEB_CLIENT_ID)
                          .requestEmail()
                          .build();
                  googleSignInClient = GoogleSignIn.getClient(this, gso);

                  mainWebView = new WebView(this);
                  mainWebView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(mainWebView);

                  configureWebSettings(mainWebView.getSettings());
                  mainWebView.addJavascriptInterface(new NativeAuthBridge(), "AndroidNativeAuth");

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(mainWebView, true);

                  mainWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost() != null ? uri.getHost() : "";
                          if (host.contains("e2b4u.pages.dev") ||
                              host.contains("firebaseapp.com") ||
                              host.contains("google.com") ||
                              host.contains("googleapis.com") ||
                              host.contains("gstatic.com")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {}
                          return true;
                      }
                  });

                  mainWebView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          MainActivity.this.filePathCallback = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Select Backup File"), FILE_CHOOSER_CODE);
                          return true;
                      }
                  });

                  mainWebView.loadUrl(APP_URL);
              }

              public class NativeAuthBridge {
                  @JavascriptInterface
                  public void signInWithGoogle() {
                      runOnUiThread(() -> {
                          Intent signInIntent = googleSignInClient.getSignInIntent();
                          startActivityForResult(signInIntent, RC_GOOGLE_SIGN_IN);
                      });
                  }

                  @JavascriptInterface
                  public void signOut() {
                      runOnUiThread(() -> googleSignInClient.signOut());
                  }

                  @JavascriptInterface
                  public String getClipboardText() {
                      final String[] result = {""};
                      final CountDownLatch latch = new CountDownLatch(1);
                      runOnUiThread(() -> {
                          try {
                              ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                              if (cm != null && cm.hasPrimaryClip()) {
                                  ClipData clip = cm.getPrimaryClip();
                                  if (clip != null && clip.getItemCount() > 0) {
                                      CharSequence text = clip.getItemAt(0).coerceToText(MainActivity.this);
                                      if (text != null) {
                                          result[0] = text.toString();
                                      }
                                  }
                              }
                          } catch (Exception ignored) {
                          } finally {
                              latch.countDown();
                          }
                      });
                      try {
                          latch.await(1, TimeUnit.SECONDS);
                      } catch (InterruptedException ignored) {}
                      return result[0];
                  }

                  @JavascriptInterface
                  public void copyToClipboard(final String text) {
                      runOnUiThread(() -> {
                          try {
                              ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                              if (cm != null && text != null) {
                                  ClipData clip = ClipData.newPlainText("E2B4U", text);
                                  cm.setPrimaryClip(clip);
                              }
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void speakText(final String text, final float rate) {
                      if (text == null || text.trim().isEmpty()) return;
                      final float safeRate = Math.max(0.4f, Math.min(2.0f, rate <= 0f ? 1.0f : rate));
                      runOnUiThread(() -> {
                          try {
                              if (textToSpeech == null) {
                                  pendingTtsText = text.trim();
                                  pendingTtsRate = safeRate;
                                  initTextToSpeech();
                                  return;
                              }
                              if (ttsReady) {
                                  textToSpeech.setSpeechRate(safeRate);
                                  textToSpeech.speak(text.trim(), TextToSpeech.QUEUE_FLUSH, null, "e2b4u_tts");
                              } else {
                                  pendingTtsText = text.trim();
                                  pendingTtsRate = safeRate;
                              }
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void stopSpeaking() {
                      runOnUiThread(() -> {
                          try {
                              pendingTtsText = null;
                              if (textToSpeech != null) {
                                  textToSpeech.stop();
                              }
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void initTextToSpeech() {
                  try {
                      ttsReady = false;
                      textToSpeech = new TextToSpeech(getApplicationContext(), status -> {
                          if (status == TextToSpeech.SUCCESS && textToSpeech != null) {
                              int res = textToSpeech.setLanguage(Locale.US);
                              if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                                  textToSpeech.setLanguage(Locale.ENGLISH);
                              }
                              ttsReady = true;
                              if (pendingTtsText != null && !pendingTtsText.isEmpty()) {
                                  String toSpeak = pendingTtsText;
                                  float rateToUse = pendingTtsRate;
                                  pendingTtsText = null;
                                  textToSpeech.setSpeechRate(rateToUse);
                                  textToSpeech.speak(toSpeak, TextToSpeech.QUEUE_FLUSH, null, "e2b4u_tts");
                              }
                          }
                      });
                  } catch (Exception ignored) {}
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void configureWebSettings(WebSettings settings) {
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  String cleanUA = settings.getUserAgentString().replace("; wv", "");
                  settings.setUserAgentString(cleanUA);

                  if (isOnline()) {
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  } else {
                      settings.setCacheMode(WebSettings.LOAD_CACHE_ELSE_NETWORK);
                  }
              }

              private boolean isOnline() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return false;
                  NetworkInfo info = cm.getActiveNetworkInfo();
                  return info != null && info.isConnected();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == RC_GOOGLE_SIGN_IN) {
                      Task<GoogleSignInAccount> task = GoogleSignIn.getSignedInAccountFromIntent(data);
                      try {
                          GoogleSignInAccount account = task.getResult(ApiException.class);
                          String idToken = account.getIdToken();
                          if (idToken != null && mainWebView != null) {
                              String safeToken = idToken.replace("'", "\\'");
                              mainWebView.post(() -> mainWebView.evaluateJavascript(
                                      "if(window.onNativeGoogleToken){window.onNativeGoogleToken('" + safeToken + "');}", null));
                          }
                      } catch (ApiException e) {
                          String msg = "Code " + e.getStatusCode();
                          if (mainWebView != null) {
                              mainWebView.post(() -> mainWebView.evaluateJavascript(
                                      "if(window.onNativeGoogleError){window.onNativeGoogleError('" + msg + "');}", null));
                          }
                      }
                      return;
                  }

                  if (requestCode == FILE_CHOOSER_CODE && filePathCallback != null) {
                      Uri[] results = (resultCode == RESULT_OK && data != null && data.getData() != null)
                              ? new Uri[]{data.getData()}
                              : null;
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (mainWebView != null && mainWebView.canGoBack()) {
                      mainWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (textToSpeech != null) {
                      try {
                          textToSpeech.stop();
                          textToSpeech.shutdown();
                      } catch (Exception ignored) {}
                      textToSpeech = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#0e1415</color>
              <color name="status_bar_dark">#0e1518</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.E2B4U" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@color/bg_dark</item>
                  <item name="android:statusBarColor">@color/status_bar_dark</item>
                  <item name="android:navigationBarColor">@color/bg_dark</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Render E2B4U v4.0 Multi-Color Gradient Adaptive & Legacy Icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

          cat << 'EOF' > background.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432">
            <defs>
              <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2dd4bf"/>
                <stop offset="50%" stop-color="#0ea5e9"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <rect width="432" height="432" fill="url(#g)"/>
          </svg>
          EOF

          cat << 'EOF' > foreground.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="-120 -120 752 752">
            <path d="M256 146v220m0-220c-21-13.5-50-21.3-78-21.3s-57 7.8-78 21.3v220c21-13.5 50-21.3 78-21.3s57 7.8 78 21.3m0-220c21-13.5 50-21.3 78-21.3s57 7.8 78 21.3v220c-21-13.5-50-21.3-78-21.3s-57 7.8-78 21.3" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF

          cat << 'EOF' > legacy_square.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2dd4bf"/>
                <stop offset="50%" stop-color="#0ea5e9"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#g)"/>
            <path d="M256 146v220m0-220c-21-13.5-50-21.3-78-21.3s-57 7.8-78 21.3v220c21-13.5 50-21.3 78-21.3s57 7.8 78 21.3m0-220c21-13.5 50-21.3 78-21.3s57 7.8 78 21.3v220c-21-13.5-50-21.3-78-21.3s-57 7.8-78 21.3" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF

          cat << 'EOF' > legacy_round.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#2dd4bf"/>
                <stop offset="50%" stop-color="#0ea5e9"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <circle cx="256" cy="256" r="256" fill="url(#g)"/>
            <path d="M256 152v208m0-208c-20-12.5-47-20-73-20s-53 7.5-73 20v208c20-12.5 47-20 73-20s53 7.5 73 20m0-208c20-12.5 47-20 73-20s53 7.5 73 20v208c-20-12.5-47-20-73-20s-53 7.5-73 20" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF

          rsvg-convert -w 432 -h 432 background.svg -o app/src/main/res/drawable/ic_launcher_background.png
          rsvg-convert -w 432 -h 432 foreground.svg -o app/src/main/res/drawable/ic_launcher_foreground.png
          rsvg-convert -w 192 -h 192 legacy_square.svg -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 legacy_round.svg -o app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Compile Release APK
        run: |
          gradle assembleRelease
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/E2B4U-v4.0.apk

      - name: Upload Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: E2B4U-v4.0
          path: output/
